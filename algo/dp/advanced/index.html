<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ДП: маски, профиль, расстояния · Алгоритмы</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/viz/base.css">
</head>
<body>
<header>
  <a href="../../index.html#dp" class="back-link">← Динамическое программирование</a>
  <h1><span>ДП: маски, профиль, расстояния</span></h1>
  <div class="complexity">
    <span class="badge">Редакционное расстояние: <b>O(nm)</b></span>
    <span class="badge">ДП по маскам: <b>O(2ⁿ·n)</b></span>
  </div>
</header>
<main>
  <div id="left-panel">
    <div id="controls"></div>
    <div class="tab-bar" id="mode-tabs" style="display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid #242424;flex-shrink:0">
      <button class="btn active" id="tab-edit" onclick="setMode('edit')">Ред. расстояние</button>
      <button class="btn" id="tab-mask" onclick="setMode('mask')">ДП по маскам</button>
    </div>
    <div id="canvas-wrap">
      <svg id="viz-svg"></svg>
      <div class="canvas-hint">Две задачи: редакционное расстояние и ДП по подмножествам</div>
    </div>
  </div>
  <div id="right-panel">
    <div id="pseudo"><h3>Псевдокод</h3></div>
    <div id="state-panel">
      <h3>Состояние</h3>
      <div class="state-row"><span class="state-key">Задача</span><span id="s-task">Ред. расстояние</span></div>
      <div class="state-row"><span class="state-key">Ячейка</span><span id="s-cell">—</span></div>
      <div class="state-row"><span class="state-key">Значение</span><span id="s-val">—</span></div>
    </div>
    <div id="step-desc">Нажмите <b>Запустить</b>.</div>
  </div>
</main>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="../../../assets/viz/engine.js"></script>
<script src="algo.js"></script>
<script src="../../../catalog.js"></script>
<script src="../../../assets/viz/nav.js"></script>
</body>
</html>
