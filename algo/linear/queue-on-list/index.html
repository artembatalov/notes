<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Очередь на связном списке · Алгоритмы</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/viz/base.css">
</head>
<body>
<header>
  <a href="../../index.html#linear" class="back-link">← Линейные структуры</a>
  <h1><span>Очередь на связном списке</span></h1>
  <div class="complexity">
    <span class="badge">Enqueue/Dequeue: <b>O(1)</b></span>
    <span class="badge">Память: <b>O(n)</b></span>
  </div>
</header>
<main>
  <div id="left-panel">
    <div id="controls"></div>
    <div id="canvas-wrap">
      <svg id="viz-svg" viewBox="0 0 700 300"></svg>
      <div class="canvas-hint">enqueue(3) enqueue(7) enqueue(1) dequeue enqueue(5) dequeue</div>
    </div>
  </div>
  <div id="right-panel">
    <div id="pseudo"><h3>Псевдокод</h3></div>
    <div id="state-panel">
      <h3>Состояние</h3>
      <div class="state-row"><span class="state-key">Размер</span><span id="s-size">0</span></div>
      <div class="state-row"><span class="state-key">FRONT / BACK</span><span id="s-fb">—</span></div>
      <div class="state-row"><span class="state-key">Операция</span><span id="s-op">—</span></div>
    </div>
    <div id="step-desc">Нажмите <b>Запустить</b>.</div>
  </div>
</main>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="../../../assets/viz/engine.js"></script>
<script src="algo.js"></script>
<script src="../../../catalog.js"></script>
<script src="../../../assets/viz/nav.js"></script>
</body>
</html>
