<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Цифровая (поразрядная) сортировка · Алгоритмы</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/viz/base.css">
</head>
<body>
<header>
  <a href="../../index.html#sorting" class="back-link">← Сортировки</a>
  <h1><span>Цифровая (поразрядная) сортировка</span></h1>
  <div class="complexity">
    <span class="badge">Время: <b>O(d·(n+k))</b></span>
    <span class="badge">Память: <b>O(n+k)</b></span>
  </div>
</header>
<main>
  <div id="left-panel">
    <div id="controls"></div>
    <div style="padding:10px 12px 0;display:flex;gap:8px;align-items:center">
      <input type="text" id="arr-input"
        style="flex:1;background:#111;border:1px solid #303030;border-radius:5px;
               color:#efefef;padding:7px 11px;font-family:'JetBrains Mono',monospace;
               font-size:13px;outline:none;transition:border-color .15s"
        value="170, 45, 75, 90, 802, 24, 2, 66"
        onfocus="this.style.borderColor='#c8973e'"
        onblur="this.style.borderColor='#303030'">
      <span style="font-size:11px;color:#585858;white-space:nowrap">← изменить, затем ▶</span>
    </div>
    <div id="canvas-wrap">
      <svg id="viz-svg"></svg>
      <div class="canvas-hint">Введите свой массив выше и нажмите Запустить</div>
    </div>
  </div>
  <div id="right-panel">
    <div id="pseudo"><h3>Псевдокод</h3></div>
    <div id="state-panel">
      <h3>Состояние</h3>
      <div class="state-row"><span class="state-key">Разряд</span><span id="s-digit">—</span></div>
      <div class="state-row"><span class="state-key">Шаг</span><span id="s-substep">—</span></div>
    </div>
    <div id="step-desc">Нажмите <b>Запустить</b>.</div>
  </div>
</main>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="../../../assets/viz/engine.js"></script>
<script src="algo.js"></script>
<script src="../../../catalog.js"></script>
<script src="../../../assets/viz/nav.js"></script>
</body>
</html>
