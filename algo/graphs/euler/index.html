<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Эйлеров цикл (Hierholzer) · Алгоритмы</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/viz/base.css">
</head>
<body>
<header>
  <a href="../../index.html#graphs" class="back-link">← Графы: обходы и связность</a>
  <h1><span>Эйлеров цикл (Hierholzer)</span></h1>
  <div class="complexity">
    <span class="badge">Время: <b>O(E)</b></span>
    <span class="badge">Память: <b>O(E)</b></span>
  </div>
</header>
<main>
  <div id="left-panel">
    <div id="controls"></div>
    <div id="canvas-wrap">
      <svg id="viz-svg"></svg>
      <div class="canvas-hint">Клик — вершина · Клик→клик — ребро · ПКМ — удалить · Тащи — перемещать</div>
    </div>
  </div>
  <div id="right-panel">
    <div id="pseudo"><h3>Псевдокод</h3></div>
    <div id="state-panel">
      <h3>Состояние</h3>
      <div class="state-row"><span class="state-key">Стек</span><div class="chips" id="chips-stack"></div></div>
      <div class="state-row"><span class="state-key">Цикл</span><div class="chips" id="chips-path"></div></div>
      <h3 style="margin-top:8px">Степени вершин</h3>
      <table class="viz-table">
        <thead><tr><th>Верш.</th><th>степень</th><th>чётная?</th></tr></thead>
        <tbody id="deg-tbody"></tbody>
      </table>
    </div>
    <div id="step-desc">Нажмите <b>Запустить</b>.</div>
    <div id="legend">
      <h3>Легенда</h3>
      <div class="legend-grid">
        <div class="legend-item"><span class="leg-dot" style="background:var(--col-gray)"></span> В стеке</div>
        <div class="legend-item"><span class="leg-line" style="background:var(--edge-tree)"></span> Пройденное ребро</div>
        <div class="legend-item"><span class="leg-line" style="background:var(--col-black)"></span> Итоговый цикл</div>
      </div>
    </div>
  </div>
</main>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="../../../assets/viz/engine.js"></script>
<script src="algo.js"></script>
<script src="../../../catalog.js"></script>
<script src="../../../assets/viz/nav.js"></script>
</body>
</html>
