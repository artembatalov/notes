<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Алгоритмы & СД</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0a0a0a;
      --s1:       #111111;
      --s2:       #181818;
      --border:   #242424;
      --border2:  #303030;
      --text:     #efefef;
      --muted:    #585858;
      --muted2:   #888;
      --amber:    #c8973e;
      --amber-hi: #e0aa52;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ── Hero ─────────────────────────────────────────── */
    .hero {
      border-bottom: 1px solid var(--border);
      padding: 52px 40px 40px;
    }
    .hero-inner { max-width: 920px; margin: 0 auto; }

    .hero-eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: clamp(30px, 4vw, 46px);
      font-weight: 800;
      letter-spacing: -1.5px;
      line-height: 1.1;
      color: var(--text);
      margin-bottom: 14px;
    }
    .hero h1 em { font-style: normal; color: var(--amber); }

    .hero p {
      font-size: 14px;
      line-height: 1.65;
      color: var(--muted2);
      max-width: 520px;
    }

    /* ── Progress bar ─────────────────────────────────── */
    .progress-wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 28px 40px 0;
    }
    .progress-track {
      height: 2px;
      background: var(--border2);
      border-radius: 2px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--amber);
      border-radius: 2px;
      transition: width .6s ease;
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--muted);
    }
    .progress-meta b { color: var(--text); font-weight: 600; }

    /* ── Filter row ───────────────────────────────────── */
    .filter-row {
      max-width: 920px;
      margin: 0 auto;
      padding: 20px 40px 0;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    .filter-sep {
      width: 1px; height: 18px;
      background: var(--border2);
      margin: 0 2px;
    }
    .filter-btn {
      background: none;
      border: 1px solid var(--border2);
      border-radius: 4px;
      padding: 5px 13px;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      transition: color .12s, border-color .12s, background .12s;
      font-family: inherit;
    }
    .filter-btn:hover { color: var(--text); border-color: var(--muted); }
    .filter-btn.active {
      color: var(--amber);
      border-color: var(--amber);
      background: rgba(200,151,62,.07);
    }
    /* semester pills */
    .sem-btn {
      background: none;
      border: 1px solid var(--border2);
      border-radius: 4px;
      padding: 5px 13px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: color .12s, border-color .12s, background .12s;
      font-family: inherit;
      letter-spacing: .3px;
    }
    .sem-btn:hover { color: var(--text); border-color: var(--muted); }
    .sem-btn.active {
      color: var(--amber);
      border-color: var(--amber);
      background: rgba(200,151,62,.07);
    }

    /* ── Grid ─────────────────────────────────────────── */
    .grid {
      max-width: 920px;
      margin: 20px auto 64px;
      padding: 0 40px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(256px, 1fr));
      gap: 10px;
    }

    /* ── Section divider ──────────────────────────────── */
    .grid-section {
      grid-column: 1 / -1;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      padding: 6px 0 2px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2px;
      margin-top: 8px;
    }
    .grid-section:first-child { margin-top: 0; }

    /* ── Card ─────────────────────────────────────────── */
    .card {
      display: block;
      background: var(--s1);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px 12px;
      text-decoration: none;
      color: inherit;
      transition: border-color .15s, background .15s;
      position: relative;
      cursor: pointer;
    }
    .card:hover { background: var(--s2); border-color: var(--border2); }
    .card.card-locked { opacity: .38; pointer-events: none; }

    .card-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
    .card-num {
      width: 26px; height: 26px;
      border: 1px solid var(--border2);
      border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; font-family: 'JetBrains Mono', monospace;
      color: var(--muted);
      flex-shrink: 0;
      margin-top: 1px;
    }
    .card:not(.card-locked) .card-num {
      color: var(--amber);
      border-color: rgba(200,151,62,.35);
    }
    .card-title { font-size: 13px; font-weight: 600; line-height: 1.4; color: var(--text); }

    .card-foot { display: flex; align-items: center; gap: 6px; }
    .cat-tag {
      font-size: 10.5px;
      font-weight: 500;
      color: var(--muted);
      border: 1px solid var(--border2);
      border-radius: 3px;
      padding: 2px 7px;
    }
    .cplx {
      margin-left: auto;
      font-size: 10.5px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted);
    }

    /* ── Sem 2 category tags ──────────────────────────── */
    .cat-traversal { color: #7a9ec8; border-color: rgba(122,158,200,.3); }
    .cat-shortpath { color: #7abf9a; border-color: rgba(122,191,154,.3); }
    .cat-flow      { color: #c8a37a; border-color: rgba(200,163,122,.3); }
    .cat-string    { color: #c87a7a; border-color: rgba(200,122,122,.3); }
    .cat-hash      { color: #aa7ac8; border-color: rgba(170,122,200,.3); }
    /* ── Sem 1 category tags ──────────────────────────── */
    .cat-sort      { color: #c8973e; border-color: rgba(200,151,62,.3); }
    .cat-struct    { color: #6a9fd4; border-color: rgba(106,159,212,.3); }
    .cat-heap      { color: #5a9a72; border-color: rgba(90,154,114,.3); }
    .cat-dp        { color: #a06ad4; border-color: rgba(160,106,212,.3); }
    .cat-analysis  { color: #d46a6a; border-color: rgba(212,106,106,.3); }

    /* ── Footer ─────────────────────────────────────────── */
    footer {
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 24px;
      font-size: 11.5px;
      color: var(--muted);
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
  </style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <div class="hero-eyebrow">ITMO IS · 1 и 2 семестр</div>
    <h1>Алгоритмы &amp;<br><em>Структуры данных</em></h1>
    <p>56 интерактивных визуализаций. Пошаговая анимация, псевдокод, редактируемый ввод — оба семестра в единой библиотеке.</p>
  </div>
</div>

<div class="progress-wrap">
  <div class="progress-track">
    <div class="progress-fill" id="prog-fill" style="width:0"></div>
  </div>
  <div class="progress-meta">
    <span>Готово: <b id="prog-count">0</b> из <b id="prog-total">56</b></span>
    <span id="prog-pct">0%</span>
  </div>
</div>

<div class="filter-row">
  <button class="sem-btn active" data-sem="all">Все</button>
  <button class="sem-btn" data-sem="1">Семестр 1</button>
  <button class="sem-btn" data-sem="2">Семестр 2</button>
  <div class="filter-sep"></div>
  <button class="filter-btn active" data-cat="all">Все темы</button>
  <!-- sem1 -->
  <button class="filter-btn" data-cat="analysis">Анализ</button>
  <button class="filter-btn" data-cat="sort">Сортировки</button>
  <button class="filter-btn" data-cat="struct">Структуры</button>
  <button class="filter-btn" data-cat="heap">Пирамида</button>
  <button class="filter-btn" data-cat="dp">Дин. прог.</button>
  <div class="filter-sep"></div>
  <!-- sem2 -->
  <button class="filter-btn" data-cat="traversal">Обходы</button>
  <button class="filter-btn" data-cat="shortpath">Кр. пути</button>
  <button class="filter-btn" data-cat="flow">Потоки</button>
  <button class="filter-btn" data-cat="string">Строки</button>
  <button class="filter-btn" data-cat="hash">Хэш</button>
</div>

<div class="grid" id="grid"></div>

<footer>Удачи на коллоквиуме ✦</footer>

<script>
/* ── Semester 1 ─────────────────────────────────────────── */
const S1 = [
  { n:'с1-01', title:'Оценка сложности по времени',      cat:'analysis', t:'O(1)–O(2ⁿ)',   href:'s1-01-complexity-time/index.html',    sem:1 },
  { n:'с1-02', title:'Оценка сложности по памяти',       cat:'analysis', t:'O(1)–O(n²)',   href:'s1-02-complexity-space/index.html',   sem:1 },
  { n:'с1-03', title:'Сортировка вставками',             cat:'sort',     t:'O(n²)',         href:'s1-03-insertion-sort/index.html',     sem:1 },
  { n:'с1-04', title:'Сортировка слиянием',              cat:'sort',     t:'O(n log n)',    href:'s1-04-merge-sort/index.html',         sem:1 },
  { n:'с1-05', title:'Быстрая сортировка',               cat:'sort',     t:'O(n log n)',    href:'s1-05-quicksort/index.html',          sem:1 },
  { n:'с1-06', title:'Сортировка подсчётом',             cat:'sort',     t:'O(n+k)',        href:'s1-06-counting-sort/index.html',      sem:1 },
  { n:'с1-07', title:'Цифровая (поразрядная) сортировка',cat:'sort',     t:'O(d·(n+k))',   href:'s1-07-radix-sort/index.html',         sem:1 },
  { n:'с1-08', title:'Стек',                             cat:'struct',   t:'O(1)',          href:'s1-08-stack/index.html',              sem:1 },
  { n:'с1-09', title:'Очередь',                          cat:'struct',   t:'O(1)',          href:'s1-09-queue/index.html',              sem:1 },
  { n:'с1-10', title:'Односвязный список',               cat:'struct',   t:'O(1)–O(n)',    href:'s1-10-linked-list-single/index.html', sem:1 },
  { n:'с1-11', title:'Двусвязный список',                cat:'struct',   t:'O(1)',          href:'s1-11-linked-list-double/index.html', sem:1 },
  { n:'с1-12', title:'Циклический список',               cat:'struct',   t:'O(1)',          href:'s1-12-linked-list-circular/index.html',sem:1},
  { n:'с1-13', title:'Стек на списках',                  cat:'struct',   t:'O(1)',          href:'s1-13-stack-on-list/index.html',      sem:1 },
  { n:'с1-14', title:'Очередь на списках',               cat:'struct',   t:'O(1)',          href:'s1-14-queue-on-list/index.html',      sem:1 },
  { n:'с1-15', title:'Пирамида',                         cat:'heap',     t:'O(log n)',      href:'s1-15-heap/index.html',               sem:1 },
  { n:'с1-16', title:'Построение пирамиды O(n)',         cat:'heap',     t:'O(n)',          href:'s1-16-heap-build-linear/index.html',  sem:1 },
  { n:'с1-17', title:'Пирамидальная сортировка',         cat:'heap',     t:'O(n log n)',    href:'s1-17-heapsort/index.html',           sem:1 },
  { n:'с1-18', title:'Удаление из пирамиды',            cat:'heap',     t:'O(log n)',      href:'s1-18-heap-delete/index.html',        sem:1 },
  { n:'с1-19', title:'Очередь с приоритетом',            cat:'heap',     t:'O(log n)',      href:'s1-19-priority-queue/index.html',     sem:1 },
  { n:'с1-20', title:'ДП: кузнечик, рюкзак, НВП',       cat:'dp',       t:'O(n)–O(nW)',   href:'s1-20-dp-basic/index.html',           sem:1 },
  { n:'с1-21', title:'Быстрый выбор (Quickselect)',      cat:'sort',     t:'O(n) avg',      href:'s1-21-quickselect/index.html',        sem:1 },
  { n:'с1-22', title:'Мастер-теорема',                   cat:'analysis', t:'T=aT(n/b)+f',  href:'s1-22-master-theorem/index.html',     sem:1 },
  { n:'с1-23', title:'ДП: маски, профиль, расстояния',  cat:'dp',       t:'O(2ⁿ·n)',      href:'s1-23-dp-advanced/index.html',        sem:1 },
  { n:'с1-24', title:'Дек. Очередь с минимумом',         cat:'struct',   t:'O(1)',          href:'s1-24-deque/index.html',              sem:1 },
  { n:'с1-25', title:'Бинарный поиск',                   cat:'analysis', t:'O(log n)',      href:'s1-25-binsearch/index.html',          sem:1 },
];

/* ── Semester 2 ─────────────────────────────────────────── */
const S2 = [
  { n:'с2-01', title:'Обход в глубину (DFS)',             cat:'traversal', t:'O(V+E)',        href:'01-dfs/index.html',            sem:2 },
  { n:'с2-02', title:'Обход в ширину (BFS)',              cat:'traversal', t:'O(V+E)',        href:'02-bfs/index.html',            sem:2 },
  { n:'с2-03', title:'Топологическая сортировка',         cat:'traversal', t:'O(V+E)',        href:'03-topo/index.html',           sem:2 },
  { n:'с2-04', title:'Конденсация графа (Косарайю)',      cat:'traversal', t:'O(V+E)',        href:'04-condensation/index.html',   sem:2 },
  { n:'с2-05', title:'Поиск и восстановление циклов',     cat:'traversal', t:'O(V+E)',        href:'05-cycles/index.html',         sem:2 },
  { n:'с2-06', title:'Гамильтонов цикл',                  cat:'traversal', t:'O(n²)',         href:'06-hamilton/index.html',       sem:2 },
  { n:'с2-07', title:'Эйлеров цикл (Хиерхольцер)',       cat:'traversal', t:'O(E)',          href:'07-euler/index.html',          sem:2 },
  { n:'с2-08', title:'Компоненты связности',              cat:'traversal', t:'O(V+E)',        href:'08-components/index.html',     sem:2 },
  { n:'с2-09', title:'Алгоритм Краскала',                 cat:'shortpath', t:'O(E log E)',    href:'09-kruskal/index.html',        sem:2 },
  { n:'с2-10', title:'Алгоритм Прима',                    cat:'shortpath', t:'O(E log V)',    href:'10-prim/index.html',           sem:2 },
  { n:'с2-11', title:'Алгоритм Беллмана–Форда',           cat:'shortpath', t:'O(VE)',         href:'11-bellman/index.html',        sem:2 },
  { n:'с2-12', title:'Кратчайшие пути в DAG',             cat:'shortpath', t:'O(V+E)',        href:'12-dag/index.html',            sem:2 },
  { n:'с2-13', title:'Алгоритм Дейкстры',                 cat:'shortpath', t:'O((V+E)log V)', href:'13-dijkstra/index.html',       sem:2 },
  { n:'с2-14', title:'Алгоритм Флойда–Уоршалла',          cat:'shortpath', t:'O(V³)',         href:'14-floyd/index.html',          sem:2 },
  { n:'с2-15', title:'Диаметр дерева',                    cat:'shortpath', t:'O(V)',          href:'15-diameter/index.html',       sem:2 },
  { n:'с2-16', title:'Алгоритм Куна',                     cat:'flow',      t:'O(VE)',         href:'16-kuhn/index.html',           sem:2 },
  { n:'с2-17', title:'Форд–Фалкерсон / Эдмондс–Карп',   cat:'flow',      t:'O(VE²)',        href:'17-maxflow/index.html',        sem:2 },
  { n:'с2-18', title:'Форд–Фалкерсон для паросочетания', cat:'flow',      t:'O(VE)',         href:'18-ff-bipartite/index.html',   sem:2 },
  { n:'с2-19', title:'Мосты и точки сочленения',          cat:'flow',      t:'O(V+E)',        href:'19-bridges/index.html',        sem:2 },
  { n:'с2-20', title:'Жадная раскраска графа',            cat:'flow',      t:'O(V+E)',        href:'20-coloring/index.html',       sem:2 },
  { n:'с2-21', title:'Хэш Рабина–Карпа',                 cat:'string',    t:'O(n+m)',        href:'21-rabin-karp/index.html',     sem:2 },
  { n:'с2-22', title:'Префикс-функция',                   cat:'string',    t:'O(n)',          href:'22-prefix/index.html',         sem:2 },
  { n:'с2-23', title:'Z-функция',                         cat:'string',    t:'O(n)',          href:'23-z-func/index.html',         sem:2 },
  { n:'с2-24', title:'Алгоритм КМП',                      cat:'string',    t:'O(n+m)',        href:'24-kmp/index.html',            sem:2 },
  { n:'с2-25', title:'Автомат для поиска подстроки',      cat:'string',    t:'O(n·|Σ|)',     href:'25-automaton/index.html',      sem:2 },
  { n:'с2-26', title:'Бор (Trie)',                        cat:'string',    t:'O(|w|)',        href:'26-trie/index.html',           sem:2 },
  { n:'с2-27', title:'Хэш-таблица: идея и коллизии',     cat:'hash',      t:'O(1) avg',     href:'27-hashing/index.html',        sem:2 },
  { n:'с2-28', title:'Открытая и закрытая адресация',     cat:'hash',      t:'O(1) avg',     href:'28-addressing/index.html',     sem:2 },
  { n:'с2-29', title:'Метод Кукушки',                     cat:'hash',      t:'O(1) avg',     href:'29-cuckoo/index.html',         sem:2 },
  { n:'с2-30', title:'Фильтр Блума',                      cat:'hash',      t:'O(k)',          href:'30-bloom/index.html',          sem:2 },
  { n:'с2-31', title:'Алгоритм Ахо–Корасик',             cat:'string',    t:'O(n+m+z)',      href:'31-aho-corasick/index.html',   sem:2 },
];

const ALGOS = [...S1, ...S2];
const total = ALGOS.length;

const CAT = {
  /* sem1 */ analysis:'Анализ', sort:'Сорт.', struct:'Структуры', heap:'Пирамида', dp:'Дин. прог.',
  /* sem2 */ traversal:'Обход', shortpath:'Кр. пути', flow:'Поток', string:'Строки', hash:'Хэш',
};

let activeSem = 'all';
let activeCat = 'all';

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const filtered = ALGOS.filter(a =>
    (activeSem === 'all' || a.sem === +activeSem) &&
    (activeCat === 'all' || a.cat === activeCat)
  );

  // Group by semester for section dividers (only when showing all sems)
  let lastSem = null;
  filtered.forEach(a => {
    if (activeSem === 'all' && a.sem !== lastSem) {
      const sec = document.createElement('div');
      sec.className = 'grid-section';
      sec.textContent = a.sem === 1 ? 'Семестр 1' : 'Семестр 2';
      grid.appendChild(sec);
      lastSem = a.sem;
    }
    const el = document.createElement('a');
    el.href = a.href;
    el.className = 'card';
    el.innerHTML = `
      <div class="card-head">
        <div class="card-num">${a.n.replace('с','')}</div>
        <div class="card-title">${a.title}</div>
      </div>
      <div class="card-foot">
        <span class="cat-tag cat-${a.cat}">${CAT[a.cat]}</span>
        <span class="cplx">${a.t}</span>
      </div>`;
    grid.appendChild(el);
  });
}

function updateProgress() {
  const pct = 100;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-count').textContent = total;
  document.getElementById('prog-total').textContent = total;
  document.getElementById('prog-pct').textContent = pct + '%';
}

// Semester filter
document.querySelectorAll('.sem-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sem-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeSem = btn.dataset.sem;
    renderGrid();
  });
});

// Category filter
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCat = btn.dataset.cat;
    renderGrid();
  });
});

updateProgress();
renderGrid();
</script>
</body>
</html>
