<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>11 — Двусвязный список</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/base.css">
</head>
<body>
<header>
  <a href="../index.html" class="back-link">← Все алгоритмы</a>
  <h1>11 — <span>Двусвязный список</span></h1>
  <div class="complexity">
    <span class="badge">Вставка/удаление: <b>O(1)</b></span>
    <span class="badge">Память: <b>O(n)</b></span>
  </div>
</header>
<main>
  <div id="left-panel">
    <div id="controls"></div>
    <div id="canvas-wrap">
      <svg id="viz-svg" viewBox="0 0 700 320"></svg>
      <div class="canvas-hint">push_back · push_front · insert_after · delete · pop_front</div>
    </div>
  </div>
  <div id="right-panel">
    <div id="pseudo"><h3>Псевдокод</h3></div>
    <div id="state-panel">
      <h3>Состояние</h3>
      <div class="state-row"><span class="state-key">Длина</span><span id="s-len">0</span></div>
      <div class="state-row"><span class="state-key">HEAD → TAIL</span><span id="s-ht">—</span></div>
      <div class="state-row"><span class="state-key">Операция</span><span id="s-op">—</span></div>
    </div>
    <div id="step-desc">Нажмите <b>Запустить</b>.</div>
  </div>
</main>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="../shared/engine.js"></script>
<script src="algo.js"></script>
</body>
</html>
