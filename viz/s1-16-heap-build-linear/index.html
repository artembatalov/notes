<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>16 — Построение пирамиды за O(n)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/base.css">
</head>
<body>
<header>
  <a href="../index.html" class="back-link">← Все алгоритмы</a>
  <h1>16 — <span>Построение пирамиды за O(n)</span></h1>
  <div class="complexity">
    <span class="badge">Время: <b>O(n)</b></span>
    <span class="badge">Память: <b>O(1)</b></span>
  </div>
</header>
<main>
  <div id="left-panel">
    <div id="controls"></div>
    <div id="canvas-wrap">
      <svg id="viz-svg" viewBox="0 0 700 380"></svg>
      <div class="canvas-hint">Алгоритм Флойда: [4, 10, 3, 5, 1, 8, 7, 2, 9, 6]</div>
    </div>
  </div>
  <div id="right-panel">
    <div id="pseudo"><h3>Псевдокод</h3></div>
    <div id="state-panel">
      <h3>Состояние</h3>
      <div class="state-row"><span class="state-key">i (sift-down)</span><span id="s-i">—</span></div>
      <div class="state-row"><span class="state-key">Сравнений</span><span id="s-cmp">0</span></div>
      <div class="state-row"><span class="state-key">Массив</span><span id="s-arr">—</span></div>
    </div>
    <div id="step-desc">Нажмите <b>Запустить</b>.</div>
  </div>
</main>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="../shared/engine.js"></script>
<script src="algo.js"></script>
</body>
</html>
