<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>15 — Пирамида (куча)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/base.css">
</head>
<body>
<header>
  <a href="../index.html" class="back-link">← Все алгоритмы</a>
  <h1>15 — <span>Пирамида (куча)</span></h1>
  <div class="complexity">
    <span class="badge">sift-up/down: <b>O(log n)</b></span>
    <span class="badge">Память: <b>O(n)</b></span>

<main>
  <div id="left-panel">
    <div id="controls"></div>
    <div id="canvas-wrap">
      <svg id="viz-svg" viewBox="0 0 700 380"></svg>
      <div class="canvas-hint">insert 4,8,5,9,3,7,1 → extract max</div>

  </div>
  <div id="right-panel">
    <div id="pseudo"><h3>Псевдокод</h3></div>
    <div id="state-panel">
      <h3>Состояние</h3>
      <div class="state-row"><span class="state-key">Размер</span><span id="s-size">0</span></div>
      <div class="state-row"><span class="state-key">Операция</span><span id="s-op">—</span></div>
      <div class="state-row"><span class="state-key">Массив</span><span id="s-arr">—</span></div>
    </div>
    <div id="step-desc">Нажмите <b>Запустить</b>.</div>
  </div>
</main>
<script src="https://d3js.org/d3.v7.min.js"></script>
