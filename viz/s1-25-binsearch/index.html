<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>С1-25 — Бинарный поиск</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/base.css">
</head>
<body>
<header>
  <a href="../index.html" class="back-link">← Все алгоритмы</a>
  <h1>С1-25 — <span>Бинарный поиск</span></h1>
  <div class="complexity">
    <span class="badge">Время: <b>O(log n)</b></span>
    <span class="badge">Память: <b>O(1)</b></span>
  </div>
</header>
<main>
  <div id="left-panel">
    <div id="controls"></div>
    <div class="tab-bar" id="mode-tabs" style="display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid #242424;flex-shrink:0">
      <button class="btn active" id="tab-lb" onclick="setMode('lb')">lower_bound</button>
      <button class="btn" id="tab-ans" onclick="setMode('ans')">По ответу</button>
      <button class="btn" id="tab-real" onclick="setMode('real')">Вещественный</button>
    </div>
    <div id="canvas-wrap">
      <svg id="viz-svg"></svg>
      <div class="canvas-hint">Три варианта бинарного поиска</div>
    </div>
  </div>
  <div id="right-panel">
    <div id="pseudo"><h3>Псевдокод</h3></div>
    <div id="state-panel">
      <h3>Состояние</h3>
      <div class="state-row"><span class="state-key">lo / hi</span><span id="s-lohi">—</span></div>
      <div class="state-row"><span class="state-key">mid</span><span id="s-mid">—</span></div>
      <div class="state-row"><span class="state-key">Итераций</span><span id="s-iter">0</span></div>
      <div class="state-row"><span class="state-key">Ответ</span><span id="s-ans">—</span></div>
    </div>
    <div id="step-desc">Нажмите <b>Запустить</b>.</div>
  </div>
</main>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="../shared/engine.js"></script>
<script src="algo.js"></script>
</body>
</html>
